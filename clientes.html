<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b3867"><title>Bez Clean — Clientes</title>
<link rel="stylesheet" href="/assets/css/base.css?v=20260916e"><script src="/assets/js/dialogs.js?v=20260916e"></script><link rel="manifest" href="/manifest.webmanifest?v=20260916e">
<style>.page{width:min(100% - 32px,1050px);margin:auto;padding:28px 0 60px}.client-list{display:grid}.client{display:grid;grid-template-columns:1fr auto;gap:14px;width:100%;padding:16px;background:#fff;border:0;border-top:1px solid var(--border);text-align:left}.client:hover{background:#fbfdff}.client:first-child{border-top:0}.client h3{margin:0;font-size:1rem}.client p{margin:5px 0 0;color:var(--muted);font-size:.86rem}.client strong{align-self:center;color:var(--navy);font-size:.84rem}.badge{display:inline-block;margin-top:8px;padding:3px 7px;color:var(--blue);background:#edf4fa;border-radius:999px;font-size:.7rem;font-weight:800}.badge.ok{color:var(--ok);background:#e5f5ed}.badge.warn{color:var(--warn);background:#fff4db}.empty{padding:42px;color:var(--muted);text-align:center}.detail p{color:var(--muted);line-height:1.45}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.detail-grid article{padding:12px;border:1px solid var(--border);border-radius:11px}.detail-grid span{display:block;color:var(--muted);font-size:.75rem}.detail-grid strong{display:block;margin-top:5px}.history{display:grid;gap:8px;margin-top:10px}.history-item{padding:11px;border:1px solid var(--border);border-radius:10px}.history-item b,.history-item small{display:block}.history-item small{margin-top:3px;color:var(--muted)}.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.detail-actions button{flex:1}@media(max-width:640px){.page{padding-top:22px}.detail-grid{grid-template-columns:1fr}}</style><link rel="apple-touch-icon" href="https://bezclean.com.br/imagens/LOGO.png"></head>
<body>
<header class="top"><div class="brand"><img src="https://bezclean.com.br/imagens/LOGO.png" alt="Bez Clean"><div><b>Bez Clean</b><small>Painel operacional</small></div></div><nav class="nav"><a href="./?v=20260916e">Agenda</a><a href="orcamentos.html?v=20260916e">Orçamentos</a></nav></header>
<main class="page"><div class="heading"><div><p class="eyebrow">RELACIONAMENTO</p><h1>Clientes</h1><p>Histórico, contato e informações de cada atendimento.</p></div><button id="newClient" class="primary">+ Novo cliente</button></div>
<section class="stats"><article><span>Total de clientes</span><strong id="totalClients">0</strong></article><article><span>Com atendimento agendado</span><strong id="scheduledClients">0</strong></article><article><span>Clientes recorrentes</span><strong id="returningClients">0</strong></article></section>
<section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Buscar por nome, WhatsApp, bairro ou cidade"></div><div id="list" class="client-list"></div></section></main>
<dialog id="clientDialog"><form id="clientForm" class="modal"><div class="modal-head"><div><p class="eyebrow">CADASTRO</p><h2 id="formTitle">Novo cliente</h2></div><button class="close" type="button" data-close="clientDialog">×</button></div><input id="clientId" type="hidden"><div class="grid"><label class="full">Nome completo<input id="name" required placeholder="Nome do cliente"></label><label>WhatsApp<input id="phone" required placeholder="(47) 99999-9999"></label><label>E-mail<input id="email" type="email" placeholder="Opcional"></label><label class="full">Endereço<input id="address" placeholder="Rua e número"></label><label>Bairro<input id="neighborhood" placeholder="Bairro"></label><label>Cidade<input id="city" placeholder="Cidade"></label><label class="full">Observações<textarea id="notes" rows="3" placeholder="Acesso, preferência, detalhes do imóvel…"></textarea></label></div><div class="actions"><button class="secondary" type="button" data-close="clientDialog">Cancelar</button><button class="primary" type="submit">Salvar cliente</button></div><p id="formMsg" class="msg"></p></form></dialog>
<dialog id="details"><div class="modal"><div class="modal-head"><div><p class="eyebrow">CLIENTE</p><h2 id="detailTitle">Detalhes</h2></div><button class="close" type="button" data-close="details">×</button></div><div id="detailContent" class="detail"></div><div class="detail-actions"><button id="whatsApp" class="secondary">Abrir WhatsApp</button><button id="edit" class="primary">Editar cadastro</button></div></div></dialog>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://qunaqtxadifmwbmycqum.supabase.co","sb_publishable_iMbIE9yLK6VGMLaEsYFbHA_S42mbd0W"),$=x=>document.getElementById(x),fmt=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0),esc=v=>{const n=document.createElement("i");n.textContent=v||"";return n.innerHTML},date=v=>new Date(v).toLocaleDateString("pt-BR");
let clients=[],appointments=[],quotes=[],current=null;
const toast=t=>{$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)};
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="./?v=20260916e";return}const results=await Promise.all([db.from("clientes").select("id,nome,telefone,email,endereco,bairro,cidade,observacoes,created_at").order("nome"),db.from("agendamentos").select("id,cliente_id,inicio_em,descricao_servico,valor,status").order("inicio_em",{ascending:false}),db.from("orcamentos").select("id,cliente_id,status,valor_total,created_at").order("created_at",{ascending:false})]);const errors=results.map(r=>r.error).filter(Boolean);if(errors.length){$("list").innerHTML='<p class="empty">Não foi possível carregar os clientes.</p>';return}clients=results[0].data||[];appointments=results[1].data||[];quotes=results[2].data||[];render()}
function clientAppointments(id){return appointments.filter(a=>a.cliente_id===id)}function clientQuotes(id){return quotes.filter(q=>q.cliente_id===id)}function activeAppointments(id){return clientAppointments(id).filter(a=>a.status!=="cancelado"&&new Date(a.inicio_em)>new Date())}
function render(){const term=$("search").value.trim().toLocaleLowerCase("pt-BR"),show=clients.filter(c=>[c.nome,c.telefone,c.bairro,c.cidade].join(" ").toLocaleLowerCase("pt-BR").includes(term));$("totalClients").textContent=clients.length;$("scheduledClients").textContent=clients.filter(c=>activeAppointments(c.id).length).length;$("returningClients").textContent=clients.filter(c=>clientAppointments(c.id).filter(a=>a.status!=="cancelado").length>1).length;$("list").innerHTML=show.length?show.map(c=>{const all=clientAppointments(c.id).filter(a=>a.status!=="cancelado"),next=activeAppointments(c.id).sort((a,b)=>new Date(a.inicio_em)-new Date(b.inicio_em))[0];return '<button class="client" data-client="'+c.id+'"><div><h3>'+esc(c.nome)+'</h3><p>'+esc(c.telefone||"Sem WhatsApp")+(c.cidade?' · '+esc(c.cidade):"")+'</p><span class="badge '+(next?"ok":"")+'">'+(next?"Próximo: "+date(next.inicio_em):all.length?all.length+" atendimento(s)":"Sem atendimentos")+'</span></div><strong>'+all.length?fmt(all.reduce((sum,a)=>sum+(+a.valor||0),0)):"Ver cadastro"+"</strong></button>"}).join(""):'<p class="empty">Nenhum cliente encontrado.</p>';document.querySelectorAll("[data-client]").forEach(b=>b.onclick=()=>openDetails(b.dataset.client))}
function reset(){current=null;$("clientForm").reset();$("clientId").value="";$("formTitle").textContent="Novo cliente";$("formMsg").textContent=""}
function openForm(client){reset();if(client){$("formTitle").textContent="Editar cliente";$("clientId").value=client.id;$("name").value=client.nome||"";$("phone").value=client.telefone||"";$("email").value=client.email||"";$("address").value=client.endereco||"";$("neighborhood").value=client.bairro||"";$("city").value=client.cidade||"";$("notes").value=client.observacoes||""}$("clientDialog").showModal()}
async function save(e){e.preventDefault();$("formMsg").textContent="";const payload={nome:$("name").value.trim(),telefone:$("phone").value.trim(),email:$("email").value.trim()||null,endereco:$("address").value.trim()||null,bairro:$("neighborhood").value.trim()||null,cidade:$("city").value.trim()||null,observacoes:$("notes").value.trim()||null,updated_at:new Date().toISOString()};if(!payload.nome||!payload.telefone){$("formMsg").textContent="Informe nome e WhatsApp.";return}const id=$("clientId").value;const {error}=id?await db.from("clientes").update(payload).eq("id",id):await db.from("clientes").insert(payload);if(error){$("formMsg").textContent=error.message;return}$("clientDialog").close();toast(id?"Cadastro atualizado!":"Cliente cadastrado!");await boot()}
function openDetails(id){
  current=clients.find(c=>c.id===id);
  if(!current)return;
  const appointmentsForClient=clientAppointments(id).filter(a=>a.status!=="cancelado");
  const quotesForClient=clientQuotes(id);
  const total=appointmentsForClient.reduce((sum,a)=>sum+(+a.valor||0),0);
  const address=[current.endereco,current.bairro,current.cidade].filter(Boolean).join(" · ");
  const history=[...appointmentsForClient.map(a=>({when:a.inicio_em,title:a.descricao_servico,subtitle:date(a.inicio_em)+" · "+a.status+" · "+fmt(a.valor)})),...quotesForClient.map(q=>({when:q.created_at,title:"Orçamento",subtitle:date(q.created_at)+" · "+q.status+" · "+fmt(q.valor_total)}))].sort((a,b)=>new Date(b.when)-new Date(a.when));
  const historyHtml=history.length?history.map(h=>'<div class="history-item"><b>'+esc(h.title)+'</b><small>'+esc(h.subtitle)+'</small></div>').join(""):'<p>Nenhum orçamento ou agendamento ainda.</p>';
  $("detailTitle").textContent=current.nome;
  $("detailContent").innerHTML=
    '<p><strong>'+esc(current.telefone||"")+'</strong>'+(current.email?" · "+esc(current.email):"")+'</p>'+
    (address?'<p>'+esc(address)+'</p>':"")+
    (current.observacoes?'<p><strong>Observações:</strong> '+esc(current.observacoes)+'</p>':"")+
    '<div class="detail-grid"><article><span>Atendimentos</span><strong>'+appointmentsForClient.length+'</strong></article><article><span>Orçamentos</span><strong>'+quotesForClient.length+'</strong></article><article><span>Total atendido</span><strong>'+fmt(total)+'</strong></article></div>'+
    '<h3>Histórico</h3><div class="history">'+historyHtml+'</div>';
  $("details").showModal();
}
$("newClient").onclick=()=>openForm();$("clientForm").onsubmit=save;$("search").oninput=render;$("edit").onclick=()=>{const c=current;$("details").close();openForm(c)};$("whatsApp").onclick=()=>{const phone=(current.telefone||"").replace(/\D/g,"");if(!phone){toast("Cadastre o WhatsApp do cliente.");return}window.open("https://wa.me/"+(phone.length===11?"55":"")+phone,"_blank")};document.addEventListener("click",e=>{if(e.target.dataset.close)$(e.target.dataset.close).close()});boot();
</script><script src="/pwa.js?v=20260916e"></script><nav class="mobile-tabs" aria-label="Páginas do painel"><a href="./?v=20260916e" class="mobile-tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 3v4m10-4v4M8 14h3m-3 3h3m4-3h2"/></svg><span>Agenda</span></a><a href="clientes.html?v=20260916e" class="mobile-tab is-active" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m4 9v-2a6 6 0 0 0-4-5.7"/></svg><span>Clientes</span></a><a href="orcamentos.html?v=20260916e" class="mobile-tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm7 0v5h4M9 12h6m-6 4h6"/></svg><span>Orçamentos</span></a><a href="mensagens.html?v=20260916e" class="mobile-tab"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M20 11.5a8 8 0 0 1-8 8 8.5 8.5 0 0 1-3.4-.7L4 20l1.2-4.6A8 8 0 1 1 20 11.5Z"/><path d="M8 11h8m-8 3h5"/></svg><span>Mensagens</span></a></nav></body></html>
