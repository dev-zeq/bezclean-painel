<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b3867"><title>Bez Clean — Clientes</title>
<style>
:root{--navy:#0b3867;--blue:#1268b3;--cyan:#25c2e0;--soft:#f0f7fb;--canvas:#f5f9fc;--ink:#132b43;--muted:#5d7082;--border:#d9e6ee;--ok:#16865a;--warn:#9a6508;--danger:#b42318;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);min-width:320px}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,5vw)}.brand{display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px;object-fit:contain;border-radius:10px}.brand b,.brand small{display:block}.brand small{color:var(--muted);margin-top:2px}.nav{display:flex;gap:8px;align-items:center}.nav a{color:var(--navy);font-weight:750;text-decoration:none;background:var(--soft);padding:10px 12px;border-radius:10px}.page{width:min(100% - 32px,1050px);margin:auto;padding:28px 0 60px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:end}.eyebrow{margin:0 0 7px;color:var(--blue);font-size:.72rem;font-weight:850;letter-spacing:.1em}.heading h1{margin:0;letter-spacing:-.04em;font-size:clamp(2rem,5vw,3rem)}.heading p:last-child{margin:8px 0 0;color:var(--muted)}.primary,.secondary{border-radius:10px;padding:11px 14px;font-weight:760;border:1px solid transparent}.primary{background:var(--blue);color:white}.secondary{background:#fff;color:var(--navy);border-color:var(--border)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stats article,.card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 5px #0b386708}.stats article{padding:16px 18px}.stats span{display:block;color:var(--muted);font-size:.83rem}.stats strong{display:block;margin-top:7px;font-size:1.3rem}.toolbar{display:flex;gap:9px;align-items:center;padding:14px}.toolbar input{flex:1}.card{overflow:hidden}.client-list{display:grid}.client{display:grid;grid-template-columns:1fr auto;gap:14px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:#fff;padding:16px}.client:hover{background:#fbfdff}.client:first-child{border-top:0}.client h3{margin:0;font-size:1rem}.client p{margin:5px 0 0;color:var(--muted);font-size:.86rem}.client strong{align-self:center;color:var(--navy);font-size:.84rem}.badge{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:999px;font-size:.7rem;font-weight:800;background:#edf4fa;color:var(--blue)}.badge.ok{background:#e5f5ed;color:var(--ok)}.badge.warn{background:#fff4db;color:var(--warn)}.empty{padding:42px;text-align:center;color:var(--muted)}dialog{width:min(100% - 20px,720px);padding:0;border:0;border-radius:18px;box-shadow:0 18px 70px #0b264059}dialog::backdrop{background:#102c4980}.modal{padding:22px;background:#fff}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.modal h2{margin:0;letter-spacing:-.025em}.close{width:32px;height:32px;border:0;border-radius:9px;background:var(--soft);font-size:1.4rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.full{grid-column:1/-1}label{display:block;margin-top:12px;font-size:.83rem;font-weight:720}input,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;color:var(--ink);background:#fff}textarea{resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.msg{min-height:16px;margin:12px 0 0;color:var(--danger);font-size:.85rem}.detail p{color:var(--muted);line-height:1.45}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.detail-grid article{padding:12px;border:1px solid var(--border);border-radius:11px}.detail-grid span{display:block;color:var(--muted);font-size:.75rem}.detail-grid strong{display:block;margin-top:5px}.history{display:grid;gap:8px;margin-top:10px}.history-item{border:1px solid var(--border);padding:11px;border-radius:10px}.history-item b,.history-item small{display:block}.history-item small{color:var(--muted);margin-top:3px}.detail-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.detail-actions button{flex:1}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;background:var(--navy);color:white;border-radius:11px;transform:translateY(150%);transition:.2s;box-shadow:0 10px 30px #0b386740}.toast.show{transform:none}@media(max-width:640px){.heading{align-items:start;flex-direction:column}.heading .primary{width:100%}.stats{grid-template-columns:1fr;gap:8px}.page{padding-top:22px}.modal{padding:18px}.grid,.detail-grid{grid-template-columns:1fr}.full{grid-column:auto}.actions .primary,.actions .secondary{flex:1}.top{padding:0 14px}.brand small{display:none}.nav a:nth-child(2){display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="https://bezclean.com.br/imagens/LOGO.png" alt="Bez Clean"><div><b>Bez Clean</b><small>Painel operacional</small></div></div><nav class="nav"><a href="./">Agenda</a><a href="orcamentos.html">Orçamentos</a></nav></header>
<main class="page"><div class="heading"><div><p class="eyebrow">RELACIONAMENTO</p><h1>Clientes</h1><p>Histórico, contato e informações de cada atendimento.</p></div><button id="newClient" class="primary">+ Novo cliente</button></div>
<section class="stats"><article><span>Total de clientes</span><strong id="totalClients">0</strong></article><article><span>Com atendimento agendado</span><strong id="scheduledClients">0</strong></article><article><span>Clientes recorrentes</span><strong id="returningClients">0</strong></article></section>
<section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Buscar por nome, WhatsApp, bairro ou cidade"></div><div id="list" class="client-list"></div></section></main>
<dialog id="clientDialog"><form id="clientForm" class="modal"><div class="modal-head"><div><p class="eyebrow">CADASTRO</p><h2 id="formTitle">Novo cliente</h2></div><button class="close" type="button" data-close="clientDialog">×</button></div><input id="clientId" type="hidden"><div class="grid"><label class="full">Nome completo<input id="name" required placeholder="Nome do cliente"></label><label>WhatsApp<input id="phone" required placeholder="(47) 99999-9999"></label><label>E-mail<input id="email" type="email" placeholder="Opcional"></label><label class="full">Endereço<input id="address" placeholder="Rua e número"></label><label>Bairro<input id="neighborhood" placeholder="Bairro"></label><label>Cidade<input id="city" placeholder="Cidade"></label><label class="full">Observações<textarea id="notes" rows="3" placeholder="Acesso, preferência, detalhes do imóvel…"></textarea></label></div><div class="actions"><button class="secondary" type="button" data-close="clientDialog">Cancelar</button><button class="primary" type="submit">Salvar cliente</button></div><p id="formMsg" class="msg"></p></form></dialog>
<dialog id="details"><div class="modal"><div class="modal-head"><div><p class="eyebrow">CLIENTE</p><h2 id="detailTitle">Detalhes</h2></div><button class="close" type="button" data-close="details">×</button></div><div id="detailContent" class="detail"></div><div class="detail-actions"><button id="whatsApp" class="secondary">Abrir WhatsApp</button><button id="edit" class="primary">Editar cadastro</button></div></div></dialog>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://qunaqtxadifmwbmycqum.supabase.co","sb_publishable_iMbIE9yLK6VGMLaEsYFbHA_S42mbd0W"),$=x=>document.getElementById(x),fmt=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+v||0),esc=v=>{const n=document.createElement("i");n.textContent=v||"";return n.innerHTML},date=v=>new Date(v).toLocaleDateString("pt-BR");
let clients=[],appointments=[],quotes=[],current=null;
const toast=t=>{$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)};
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="./";return}const results=await Promise.all([db.from("clientes").select("id,nome,telefone,email,endereco,bairro,cidade,observacoes,created_at").order("nome"),db.from("agendamentos").select("id,cliente_id,inicio_em,descricao_servico,valor,status").order("inicio_em",{ascending:false}),db.from("orcamentos").select("id,cliente_id,status,valor_total,created_at").order("created_at",{ascending:false})]);const errors=results.map(r=>r.error).filter(Boolean);if(errors.length){$("list").innerHTML='<p class="empty">Não foi possível carregar os clientes.</p>';return}clients=results[0].data||[];appointments=results[1].data||[];quotes=results[2].data||[];render()}
function clientAppointments(id){return appointments.filter(a=>a.cliente_id===id)}function clientQuotes(id){return quotes.filter(q=>q.cliente_id===id)}function activeAppointments(id){return clientAppointments(id).filter(a=>a.status!=="cancelado"&&new Date(a.inicio_em)>new Date())}
function render(){const term=$("search").value.trim().toLocaleLowerCase("pt-BR"),show=clients.filter(c=>[c.nome,c.telefone,c.bairro,c.cidade].join(" ").toLocaleLowerCase("pt-BR").includes(term));$("totalClients").textContent=clients.length;$("scheduledClients").textContent=clients.filter(c=>activeAppointments(c.id).length).length;$("returningClients").textContent=clients.filter(c=>clientAppointments(c.id).filter(a=>a.status!=="cancelado").length>1).length;$("list").innerHTML=show.length?show.map(c=>{const all=clientAppointments(c.id).filter(a=>a.status!=="cancelado"),next=activeAppointments(c.id).sort((a,b)=>new Date(a.inicio_em)-new Date(b.inicio_em))[0];return '<button class="client" data-client="'+c.id+'"><div><h3>'+esc(c.nome)+'</h3><p>'+esc(c.telefone||"Sem WhatsApp")+(c.cidade?' · '+esc(c.cidade):"")+'</p><span class="badge '+(next?"ok":"")+'">'+(next?"Próximo: "+date(next.inicio_em):all.length?all.length+" atendimento(s)":"Sem atendimentos")+'</span></div><strong>'+all.length?fmt(all.reduce((sum,a)=>sum+(+a.valor||0),0)):"Ver cadastro"+"</strong></button>"}).join(""):'<p class="empty">Nenhum cliente encontrado.</p>';document.querySelectorAll("[data-client]").forEach(b=>b.onclick=()=>openDetails(b.dataset.client))}
function reset(){current=null;$("clientForm").reset();$("clientId").value="";$("formTitle").textContent="Novo cliente";$("formMsg").textContent=""}
function openForm(client){reset();if(client){$("formTitle").textContent="Editar cliente";$("clientId").value=client.id;$("name").value=client.nome||"";$("phone").value=client.telefone||"";$("email").value=client.email||"";$("address").value=client.endereco||"";$("neighborhood").value=client.bairro||"";$("city").value=client.cidade||"";$("notes").value=client.observacoes||""}$("clientDialog").showModal()}
async function save(e){e.preventDefault();$("formMsg").textContent="";const payload={nome:$("name").value.trim(),telefone:$("phone").value.trim(),email:$("email").value.trim()||null,endereco:$("address").value.trim()||null,bairro:$("neighborhood").value.trim()||null,cidade:$("city").value.trim()||null,observacoes:$("notes").value.trim()||null,updated_at:new Date().toISOString()};if(!payload.nome||!payload.telefone){$("formMsg").textContent="Informe nome e WhatsApp.";return}const id=$("clientId").value;const {error}=id?await db.from("clientes").update(payload).eq("id",id):await db.from("clientes").insert(payload);if(error){$("formMsg").textContent=error.message;return}$("clientDialog").close();toast(id?"Cadastro atualizado!":"Cliente cadastrado!");await boot()}
function openDetails(id){current=clients.find(c=>c.id===id);const ap=clientAppointments(id).filter(a=>a.status!=="cancelado"),qs=clientQuotes(id),total=ap.reduce((sum,a)=>sum+(+a.valor||0),0),history=[...ap.map(a=>({when:a.inicio_em,title:a.descricao_servico,subtitle:date(a.inicio_em)+" · "+a.status+" · "+fmt(a.valor)})),...qs.map(q=>({when:q.created_at,title:"Orçamento",subtitle:date(q.created_at)+" · "+q.status+" · "+fmt(q.valor_total)}))].sort((a,b)=>new Date(b.when)-new Date(a.when));$("detailTitle").textContent=current.nome;$("detailContent").innerHTML='<p><strong>'+esc(current.telefone||"")+'</strong>'+(current.email?" · "+esc(current.email):"")+'</p>'+(current.endereco?'<p>'+esc([current.endereco,current.bairro,current.cidade].filter(Boolean).join(" · "))+"</p>":"")+(current.observacoes?'<p><strong>Observações:</strong> '+esc(current.observacoes)+"</p>":"")+'<div class="detail-grid"><article><span>Atendimentos</span><strong>'+ap.length+"</strong></article><article><span>Orçamentos</span><strong>"+qs.length+"</strong></article><article><span>Total atendido</span><strong>"+fmt(total)+"</strong></article></div><h3>Histórico</h3><div class="history">"+(history.length?history.map(h=>'<div class="history-item"><b>'+esc(h.title)+'</b><small>'+esc(h.subtitle)+"</small></div>").join(""):'<p>Nenhum orçamento ou agendamento ainda.</p>')+"</div>";$("details").showModal()}
$("newClient").onclick=()=>openForm();$("clientForm").onsubmit=save;$("search").oninput=render;$("edit").onclick=()=>{const c=current;$("details").close();openForm(c)};$("whatsApp").onclick=()=>{const phone=(current.telefone||"").replace(/\D/g,"");if(!phone){toast("Cadastre o WhatsApp do cliente.");return}window.open("https://wa.me/"+(phone.length===11?"55":"")+phone,"_blank")};document.addEventListener("click",e=>{if(e.target.dataset.close)$(e.target.dataset.close).close()});boot();
</script></body></html>
