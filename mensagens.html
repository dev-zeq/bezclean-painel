}@media(max-width:640px){.top{height:60px}.top .brand img{width:36px;height:36px}.top .brand small,.top .nav,.top>a{display:none}.page{padding-bottom:24px}}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="https://bezclean.com.br/imagens/LOGO.png"></head><body><header class="top"><strong>Bez Clean</strong><a href="./">← Agenda</a></header><main class="page"><p class="ey">ATENDIMENTO</p><h1>Mensagens</h1><p class="intro">Edite os textos que o painel usa. Os campos entre chaves são preenchidos automaticamente quando existirem.</p><section id="list" class="card"></section></main><dialog id="dialog"><form id="form" class="modal"><div class="head"><div><p class="ey">MODELO</p><h2 id="title"></h2></div><button type="button" class="x" data-close>×</button></div><input id="id" type="hidden"><label>Mensagem<textarea id="content"></textarea></label><p class="hint">Campos disponíveis: {nome}, {itens}, {valor}, {data}, {horario}.</p><div class="actions"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar mensagem</button></div><p id="msg" class="msg"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://qunaqtxadifmwbmycqum.supabase.co","sb_publishable_iMbIE9yLK6VGMLaEsYFbHA_S42mbd0W"),$=x=>document.getElementById(x);let models=[];const defaults=[["orcamento","Envio de orçamento","Olá, {nome}! Segue seu orçamento Bez Clean:\n\n{itens}\n\nTotal: {valor}\n\nFicamos à disposição para agendar!"],["confirmacao","Confirmação de agendamento","Olá, {nome}! Confirmamos seu atendimento para {data}, às {horario}. Qualquer dúvida, estamos à disposição."],["lembrete","Lembrete de atendimento","Olá, {nome}! Passando para lembrar do seu atendimento amanhã, {data}, às {horario}. Até lá!"],["pos_servico","Pós-serviço","Olá, {nome}! Obrigado por confiar na Bez Clean. Esperamos que tenha gostado do resultado!"],[
