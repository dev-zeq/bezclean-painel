<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bez Clean — Mensagens</title><style>:root{font-family:Inter,system-ui,sans-serif;--n:#0b3867;--b:#1268b3;--bd:#d9e6ee;--bg:#f5f9fc;--m:#5d7082}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#132b43}.top{height:70px;padding:0 max(16px,5vw);display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--bd)}a{text-decoration:none;color:var(--n);font-weight:750;background:#f0f7fb;padding:10px 12px;border-radius:10px}.page{width:min(100% - 32px,800px);margin:auto;padding:28px 0}.ey{margin:0 0 8px;color:var(--b);font-size:.72rem;font-weight:850;letter-spacing:.1em}h1{margin:0;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em}.intro{color:var(--m);line-height:1.5}.card{margin-top:20px;background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.model{width:100%;padding:16px;border:0;border-top:1px solid var(--bd);background:#fff;text-align:left}.model:first-child{border:0}.model b,.model span{display:block}.model span{margin-top:4px;color:var(--m);font-size:.85rem}.model:hover{background:#f5fbff}dialog{width:min(100% - 24px,650px);padding:0;border:0;border-radius:16px;box-shadow:0 18px 70px #0b264059}.modal{padding:20px}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0}.x{border:0;border-radius:9px;background:#f0f7fb;font-size:1.35rem;width:32px;height:32px}label{display:block;margin-top:15px;font-size:.85rem;font-weight:750}textarea{display:block;width:100%;min-height:230px;margin-top:6px;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;line-height:1.45}.hint{color:var(--m);font-size:.8rem;line-height:1.45}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}button{font:inherit;cursor:pointer}.primary,.secondary{padding:11px 14px;border-radius:10px;font-weight:750}.primary{border:0;background:var(--b);color:#fff}.secondary{border:1px solid var(--bd);background:#fff;color:var(--n)}.msg{color:#b42318;font-size:.84rem}@media(max-width:640px){.page{padding-top:22px}.actions button{flex:1}}</style></head><body><header class="top"><strong>Bez Clean</strong><a href="./">← Agenda</a></header><main class="page"><p class="ey">ATENDIMENTO</p><h1>Mensagens</h1><p class="intro">Edite os textos que o painel usa. Os campos entre chaves são preenchidos automaticamente quando existirem.</p><section id="list" class="card"></section></main><dialog id="dialog"><form id="form" class="modal"><div class="head"><div><p class="ey">MODELO</p><h2 id="title"></h2></div><button type="button" class="x" data-close>×</button></div><input id="id" type="hidden"><label>Mensagem<textarea id="content"></textarea></label><p class="hint">Campos disponíveis: {nome}, {itens}, {valor}, {data}, {horario}.</p><div class="actions"><button type="button" class="secondary" data-close>Cancelar</button><button class="primary">Salvar mensagem</button></div><p id="msg" class="msg"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://qunaqtxadifmwbmycqum.supabase.co","sb_publishable_iMbIE9yLK6VGMLaEsYFbHA_S42mbd0W"),$=x=>document.getElementById(x);let models=[];const defaults=[["orcamento","Envio de orçamento","Olá, {nome}! Segue seu orçamento Bez Clean:\n\n{itens}\n\nTotal: {valor}\n\nFicamos à disposição para agendar!"],["confirmacao","Confirmação de agendamento","Olá, {nome}! Confirmamos seu atendimento para {data}, às {horario}. Qualquer dúvida, estamos à disposição."],["lembrete","Lembrete de atendimento","Olá, {nome}! Passando para lembrar do seu atendimento amanhã, {data}, às {horario}. Até lá!"],["pos_servico","Pós-serviço","Olá, {nome}! Obrigado por confiar na Bez Clean. Esperamos que tenha gostado do resultado!"],["cobranca","Cobrança","Olá, {nome}! Passando para lembrar do pagamento pendente referente ao atendimento. Valor: {valor}."]];async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="./";return}let {data}=await db.from("modelos_mensagem").select("*").order("titulo");if(!data?.length){await db.from("modelos_mensagem").insert(defaults.map(x=>({chave:x[0],titulo:x[1],conteudo:x[2]})));data=(await db.from("modelos_mensagem").select("*").order("titulo")).data}models=data||[];render()}function render(){$("list").innerHTML=models.map(m=>'<button class="model" data-id="'+m.id+'"><b>'+m.titulo+'</b><span>'+m.conteudo.replace(/\n/g," ").slice(0,100)+'</span></button>').join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}function open(id){const m=models.find(x=>x.id===id);$("id").value=m.id;$("title").textContent=m.titulo;$("content").value=m.conteudo;$("msg").textContent="";$("dialog").showModal()}$("form").onsubmit=async e=>{e.preventDefault();const {error}=await db.from("modelos_mensagem").update({conteudo:$("content").value.trim(),updated_at:new Date().toISOString()}).eq("id",$("id").value);if(error){$("msg").textContent=error.message;return}$("dialog").close();await boot()};document.addEventListener("click",e=>{if(e.target.dataset.close)$("dialog").close()});boot();</script></body></html>
